# ═══════════════════════════════════════════════════════════════════
# Workflow: Generate Contribution Snake Animation
# Purpose:  Creates an animated SVG snake eating your contribution graph
#           Outputs both light and dark theme versions
# Runs:     Daily at midnight UTC + on manual trigger
# Author:   Arslan-web-Dev
# ═══════════════════════════════════════════════════════════════════

name: 🐍 Generate Snake Animation

on:
  # ── Run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # ── Run when pushing to main (so snake updates with new contributions)
  push:
    branches: [main]

  # ── Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  generate-snake:
    name: 🐍 Generate Contribution Snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # ── Needs write access to push to the output branch
    permissions:
      contents: write

    steps:
      # ── Step 1: Checkout main branch
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Generate the snake animation SVGs
      #           Platane's action fetches your contribution grid
      #           and generates an animated snake that eats the dots
      - name: 🎨 Generate Snake SVG (Dark + Light + Colorful)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Arslan-web-Dev

          # ── Output file paths (pushed to 'output' branch)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      # ── Step 3: Push the generated files to 'output' branch
      #           README.md references these from the output branch
      - name: 📤 Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 Auto-update: Contribution snake animation [$(date -u '+%Y-%m-%d')]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 4: Job summary
      - name: 📊 Snake Generation Summary
        run: |
          echo "### 🐍 Snake Animation Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Light theme:** \`github-contribution-grid-snake.svg\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dark theme:** \`github-contribution-grid-snake-dark.svg\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** output" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
